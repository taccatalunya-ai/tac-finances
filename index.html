<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAC · Gestió Econòmica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#EAE7DF; --border:#D8D3C6;
    --text:#1D1B18; --text-muted:#6B6558; --accent:#A8232E; --accent-ink:#FFFFFF;
    --positive:#1F6E56; --positive-bg:#DCEEE7;
    --negative:#A8232E; --negative-bg:#F6DEE0;
    --warn:#8A5A12; --warn-bg:#F3E6C9; --focus:#2F6F9E;
    --font-display:'Bebas Neue','Arial Narrow',sans-serif;
    --font-body:'Inter',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17171B; --surface:#1F2024; --surface-2:#26272C; --border:#3A3A40;
      --text:#ECEAE4; --text-muted:#9A9AA2; --accent:#E14654; --accent-ink:#17171B;
      --positive:#3EBE9A; --positive-bg:#173029; --negative:#E14654; --negative-bg:#331A1D;
      --warn:#E0AF52; --warn-bg:#332A15; --focus:#6CB2E8;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;}
  h1,h2,h3{font-family:var(--font-display);letter-spacing:.02em;font-weight:400;margin:0;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}
  a{color:var(--accent);}
  ::selection{background:var(--accent);color:var(--accent-ink);}
  .hidden{display:none !important;}

  #loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;}

  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;width:100%;max-width:380px;padding:36px 32px;}
  .login-card h1{font-size:44px;line-height:1;color:var(--accent);margin-bottom:4px;}
  .login-card .sub{color:var(--text-muted);font-size:14px;margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;}
  .field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);font-size:15px;}
  .field input:focus,.field select:focus,button:focus-visible,textarea:focus{outline:2px solid var(--focus);outline-offset:1px;}
  .btn-primary{padding:12px 20px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:3px;font-size:14px;font-weight:600;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed;}
  .login-error{color:var(--negative);font-size:13px;margin-top:10px;min-height:16px;}

  #app{display:none;min-height:100vh;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:5;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-size:26px;color:var(--accent);}
  .brand span{font-size:12px;color:var(--text-muted);}
  .who{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--text-muted);}
  .who b{color:var(--text);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:3px;font-size:13px;}
  .btn-ghost:hover{background:var(--surface-2);}
  .role-badge{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em;}
  .role-badge.admin{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

  .layout{display:flex;max-width:1180px;margin:0 auto;min-height:calc(100vh - 60px);}
  nav.side{width:190px;flex-shrink:0;padding:22px 14px;border-right:1px solid var(--border);}
  .nav-group{margin-bottom:22px;}
  .nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:8px;padding:0 8px;}
  .nav-btn{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 10px;border-radius:3px;font-size:14.5px;margin-bottom:2px;}
  .nav-btn:hover{background:var(--surface-2);}
  .nav-btn.active{background:var(--accent);color:var(--accent-ink);font-weight:600;}

  main{flex:1;padding:26px 30px;min-width:0;}
  .content-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
  .content-header h2{font-size:30px;}
  .content-header .desc{color:var(--text-muted);font-size:13.5px;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:20px;margin-bottom:20px;}
  .panel h3{font-size:20px;margin-bottom:14px;color:var(--text);}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:7px 10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  tr.total-row td{font-weight:700;border-top:2px solid var(--text);border-bottom:none;padding-top:10px;}
  .cell-input{width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums;}
  .cell-input.text{text-align:left;}
  .cell-input:disabled{opacity:.7;cursor:not-allowed;}

  .balance-row{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap;}
  .balance-box{flex:1;min-width:160px;padding:14px 16px;border-radius:4px;border:1px solid var(--border);}
  .balance-box .label{font-size:12px;color:var(--text-muted);margin-bottom:4px;}
  .balance-box .value{font-size:26px;font-family:var(--font-display);}
  .balance-box.pos{background:var(--positive-bg);}
  .balance-box.pos .value{color:var(--positive);}
  .balance-box.neg{background:var(--negative-bg);}
  .balance-box.neg .value{color:var(--negative);}

  .quota-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:6px;}
  .quota-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border);border-radius:3px;background:var(--bg);font-size:13.5px;}
  .quota-item input[type=checkbox]{width:17px;height:17px;flex-shrink:0;accent-color:var(--positive);}
  .quota-item.paid{border-color:var(--positive);}
  .quota-item .quota-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .quota-item .quota-name.editable{cursor:pointer;}
  .quota-item .quota-name.editable:hover{color:var(--accent);text-decoration:underline;}
  .quota-summary{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;}
  .quota-summary .balance-box{min-width:150px;}

  .icon-btn{background:none;border:1px solid var(--border);border-radius:3px;width:26px;height:26px;color:var(--text-muted);font-size:14px;line-height:1;padding:0;}
  .icon-btn:hover{color:var(--negative);border-color:var(--negative);}
  .icon-btn.move-btn:hover{color:var(--accent);border-color:var(--accent);}
  .add-row-btn{margin-top:10px;background:none;border:1px dashed var(--border);color:var(--text-muted);padding:7px 12px;border-radius:3px;font-size:13px;}
  .add-row-btn:hover{color:var(--text);border-color:var(--text);}

  .notes-list{display:flex;flex-direction:column;gap:10px;}
  .note-item{border:1px solid var(--border);border-radius:4px;padding:12px 14px;background:var(--bg);}
  .note-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--text-muted);gap:8px;}
  .note-actions{display:flex;gap:6px;flex-shrink:0;}
  .note-body{font-size:14px;white-space:pre-wrap;color:var(--text);line-height:1.5;word-break:break-word;}
  .note-author{font-weight:600;color:var(--text);}
  .note-author.mine{color:var(--accent);}

  .save-toast{position:fixed;bottom:20px;right:20px;background:var(--positive);color:var(--bg);padding:10px 18px;border-radius:4px;font-size:13px;font-weight:600;opacity:0;transform:translateY(8px);transition:all .25s ease;pointer-events:none;z-index:100;}
  .save-toast.show{opacity:1;transform:translateY(0);}
  .save-toast.error{background:var(--negative);}

  .readonly-hint{font-size:12px;color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:3px;margin-bottom:12px;display:inline-block;}

  /* --- Estils per a festivals --- */
  .festival-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .festival-filters label{font-size:12px;color:var(--text-muted);margin-right:4px;}
  .festival-filters select{padding:6px 9px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);font-size:13px;}
  .festival-table td.actions{white-space:nowrap;text-align:right;}
  .festival-table .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);text-transform:uppercase;letter-spacing:.03em;}
  .festival-table .badge.pendent{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);}
  .festival-table .badge.contactat{background:var(--surface-2);color:var(--text-muted);}
  .festival-table .badge.confirmat{background:var(--positive-bg);color:var(--positive);border-color:var(--positive);}
  .festival-table .badge.pagat{background:var(--positive);color:var(--accent-ink);border-color:var(--positive);}
  .festival-table .badge.descartat{background:var(--negative-bg);color:var(--negative);border-color:var(--negative);}
  .festival-table .badge.desconegut{background:transparent;color:var(--text-muted);border-style:dashed;font-style:italic;}
  .festival-table td .pendent-info{color:var(--warn);font-style:italic;font-size:12.5px;}
  .festival-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .festival-form .field{margin-bottom:0;}
  .festival-form .full{grid-column:1/-1;}
  .festival-form textarea{width:100%;min-height:70px;padding:8px 10px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);font-size:13.5px;resize:vertical;}
  .festival-form-actions{display:flex;gap:10px;margin-top:14px;justify-content:flex-end;}
  .btn-secondary{padding:10px 16px;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:3px;font-size:13.5px;font-weight:600;}
  .btn-secondary:hover{background:var(--surface-2);}

  @media (max-width:760px){
    .layout{flex-direction:column;}
    nav.side{width:100%;border-right:none;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:12px 14px;gap:18px;}
    .nav-group{margin-bottom:0;flex-shrink:0;}
    .nav-btn{padding:7px 10px;white-space:nowrap;}
    main{padding:20px 16px;}
  }
</style>
</head>
<body>

<div id="loading-screen">Carregant…</div>

<div id="login-screen" class="hidden">
  <div class="login-card">
    <h1>TAC</h1>
    <div class="sub">Gestió econòmica · Accés restringit</div>
    <form id="login-form">
      <div class="field">
        <label for="login-email">Correu electrònic</label>
        <input type="email" id="login-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="login-password">Contrasenya</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="login-btn" style="width:100%;margin-top:8px;">Entrar</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand"><h1>TAC</h1><span>Gestió econòmica</span></div>
    <div class="who">
      <span id="user-email"></span>
      <span class="role-badge" id="user-role"></span>
      <button class="btn-ghost" id="logout-btn">Tancar sessió</button>
    </div>
  </div>
  <div class="layout">
    <nav class="side" id="side-nav"></nav>
    <main id="main-content"></main>
  </div>
</div>

<div class="save-toast" id="save-toast">Desat</div>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = 'https://mdcoxadgfvgvjziilszg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_w36LYKErZZc8sL1gPLbKAQ_jMeXlpH5';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const SECTION_LABELS = {ingressos:"Ingressos", despeses:"Despeses", quotes:"Quotes", festivals:"Festivals", notes:"Notes"};
  let YEARS = [2026, 2025, 2024];
  const QUOTA_TAC = 60, QUOTA_AMICS = 10;

  const ESTATS = ["pendent","contactat","confirmat","pagat","descartat"];

  let DATA = null;
  let FESTIVALS = [];
  let currentYear = 2026;
  let currentSection = "ingressos";
  let currentUser = null;
  let MY_ROLE = 'viewer';
  let NOTES = [];

  let festivalFilterEstat = "tots";
  let festivalSearch = "";
  let editingFestivalId = null;

  const isAdmin = () => MY_ROLE === 'admin';

  // ---------- TOAST ----------
  let toastTimer;
  function toast(msg, isError){
    const t = document.getElementById("save-toast");
    t.textContent = msg || "Desat";
    t.classList.toggle("error", !!isError);
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
  }

  // ---------- HELPERS ----------
  const fmt = n => (Math.round((+n||0)*100)/100).toLocaleString("ca-ES",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
  const sum = (arr, key) => arr.reduce((a,b)=>a+(+b[key]||0),0);
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function formatDate(iso){
    if(!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleString("ca-ES", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }
  function formatDateShort(iso){
    if(!iso) return "—";
    const d = new Date(iso + "T00:00:00");
    if(isNaN(d)) return "—";
    return d.toLocaleDateString("ca-ES", {day:"2-digit",month:"2-digit",year:"numeric"});
  }
  function isEmpty(v){ return v === null || v === undefined || String(v).trim() === ""; }
  function pendent(v, fallback){
    return isEmpty(v) ? '<span class="pendent-info">'+(fallback||'Pendent')+'</span>' : esc(v);
  }

  // ---------- AUTH ----------
  function showLoading(){
    document.getElementById("loading-screen").classList.remove("hidden");
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("app").style.display = "none";
  }
  function showLogin(){
    document.getElementById("loading-screen").classList.add("hidden");
    document.getElementById("login-screen").classList.remove("hidden");
    document.getElementById("app").style.display = "none";
  }
  function showApp(){
    document.getElementById("loading-screen").classList.add("hidden");
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("app").style.display = "block";
    document.getElementById("user-email").textContent = currentUser ? currentUser.email : "";
    const badge = document.getElementById("user-role");
    badge.textContent = isAdmin() ? "Admin" : "Consulta";
    badge.classList.toggle("admin", isAdmin());
  }

  document.getElementById("login-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const btn = document.getElementById("login-btn");
    const errBox = document.getElementById("login-error");
    errBox.textContent = "";
    btn.disabled = true; btn.textContent = "Entrant…";
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = "Entrar";
    if(error){
      errBox.textContent = "Error: " + error.message;
      console.error("Login error:", error);
      return;
    }
    currentUser = data.user;
    await bootApp();
  });

  document.getElementById("logout-btn").addEventListener("click", async ()=>{
    await sb.auth.signOut();
    currentUser = null;
    DATA = null; FESTIVALS = []; MY_ROLE = 'viewer'; NOTES = [];
    document.getElementById("login-password").value = "";
    showLogin();
  });

  // ---------- DATA LOAD ----------
  async function fetchAll(){
    const { data, error } = await sb.from("finances").select("*");
    if(error) throw error;

    const result = {};
    YEARS.forEach(y=>{ result[y] = {ingressos:[], despeses:[]}; });

    (data||[]).forEach(r=>{
      const y = r.year;
      if(!result[y]) result[y] = {ingressos:[], despeses:[]};
      const item = { id:r.id, concepte:r.concepte, previst:Number(r.previst)||0, real:Number(r.real)||0 };
      if(r.kind === "despeses") item.justificant = r.justificant || "-";
      result[y][r.kind].push(item);
    });
    return result;
  }

  async function fetchFestivals(){
    const { data, error } = await sb.from("festivals").select("*").order("ordre", {ascending:true});
    if(error){ console.error(error); FESTIVALS = []; return; }
    FESTIVALS = data || [];
  }

  async function loadNotes(){
    const { data, error } = await sb.from("notes").select("*").order("created_at", {ascending:false});
    if(error){ console.error(error); NOTES = []; return; }
    NOTES = data || [];
  }

  async function bootApp(){
    showLoading();
    try{
      DATA = await fetchAll();
      await fetchFestivals();
      const { data: prof } = await sb.from("profiles").select("role").eq("id", currentUser.id).maybeSingle();
      MY_ROLE = (prof && prof.role) || 'viewer';
      await loadNotes();
      if(YEARS.length > 0 && !YEARS.includes(currentYear)){
        currentYear = YEARS[0];
      }
      showApp();
      renderAll();
    }catch(err){
      console.error(err);
      toast("Error carregant dades: " + (err.message||err), true);
      showApp();
    }
  }

  // ---------- RENDER ----------
  function renderAll(){ renderNav(); renderMain(); }

  function renderNav(){
    const nav = document.getElementById("side-nav");
    nav.innerHTML = "";
    const gYear = document.createElement("div");
    gYear.className = "nav-group";
    gYear.innerHTML = '<div class="nav-label">Any</div>';
    YEARS.forEach(y=>{
      const b = document.createElement("button");
      b.className = "nav-btn" + (y===currentYear ? " active":"");
      b.textContent = y;
      b.addEventListener("click", ()=>{ currentYear = y; renderAll(); });
      gYear.appendChild(b);
    });
    if(isAdmin()){
      const bAdd = document.createElement("button");
      bAdd.className = "nav-btn";
      bAdd.style.color = "var(--accent)";
      bAdd.textContent = "+ Afegir any";
      bAdd.addEventListener("click", afegirAny);
      gYear.appendChild(bAdd);

      if(currentYear != null){
        const bDel = document.createElement("button");
        bDel.className = "nav-btn";
        bDel.style.color = "var(--negative)";
        bDel.style.fontSize = "12.5px";
        bDel.textContent = "✕ Esborrar any " + currentYear;
        bDel.addEventListener("click", esborrarAny);
        gYear.appendChild(bDel);
      }
    }
    nav.appendChild(gYear);

    const gSec = document.createElement("div");
    gSec.className = "nav-group";
    gSec.innerHTML = '<div class="nav-label">Secció</div>';
    Object.keys(SECTION_LABELS).forEach(s=>{
      const b = document.createElement("button");
      b.className = "nav-btn" + (s===currentSection ? " active":"");
      b.textContent = SECTION_LABELS[s];
      b.addEventListener("click", ()=>{ currentSection = s; renderAll(); });
      gSec.appendChild(b);
    });
    nav.appendChild(gSec);
  }

  function renderMain(){
    const main = document.getElementById("main-content");
    main.innerHTML = "";
    const header = document.createElement("div");
    header.className = "content-header";
    const sectionLabel = SECTION_LABELS[currentSection];
    let title;
    if(currentSection === "notes") title = sectionLabel;
    else if(currentSection === "festivals") title = "Festivals · " + (currentYear != null ? currentYear : "");
    else title = sectionLabel + (currentYear != null ? " " + currentYear : "");
    const desc = isAdmin()
      ? 'Els canvis es desen automàticament al servidor.'
      : 'Mode consulta · només lectura.';
    header.innerHTML = '<h2>'+title+'</h2><span class="desc">'+desc+'</span>';
    main.appendChild(header);

    if(currentSection === "notes"){ main.appendChild(buildNotesPanel()); return; }
    if(currentSection === "festivals"){ main.appendChild(buildFestivalsPanel()); return; }

    if(currentYear == null || !DATA || !DATA[currentYear]){
      const msg = document.createElement("div");
      msg.style.color = "var(--text-muted)";
      msg.style.fontSize = "14px";
      msg.textContent = currentYear == null
        ? "No hi ha cap any. Afegeix-ne un des del menú lateral."
        : "Sense dades per a aquest any.";
      main.appendChild(msg);
      return;
    }

    if(!isAdmin()){
      const hint = document.createElement("div");
      hint.className = "readonly-hint";
      hint.textContent = "No tens permisos per editar. Només pots veure les dades.";
      main.appendChild(hint);
    }

    if(currentSection === "quotes") main.appendChild(buildQuotesPanel());
    else main.appendChild(buildMoneyPanel(currentSection));
  }

  // ---------- MONEY PANEL ----------
  function buildMoneyPanel(kind){
    const yearData = DATA[currentYear];
    const rows = yearData[kind];
    const hasJust = kind === "despeses";
    const editable = isAdmin();
    const panel = document.createElement("div");
    panel.className = "panel";

    const table = document.createElement("table");
    table.innerHTML = '<thead><tr>'+
      '<th>Concepte</th><th class="num">Previst</th><th class="num">Real</th>'+
      (hasJust ? '<th>Justificant</th>' : '')+(editable ? '<th></th>' : '')+'</tr></thead>';
    const tbody = document.createElement("tbody");

    rows.forEach(row=>{
      const tr = document.createElement("tr");
      const tdC = document.createElement("td");
      const inpC = document.createElement("input");
      inpC.className = "cell-input text"; inpC.value = row.concepte;
      inpC.disabled = !editable;
      inpC.addEventListener("change", async ()=>{
        row.concepte = inpC.value;
        const { error } = await sb.from("finances").update({concepte:row.concepte}).eq("id", row.id);
        if(error){ toast("Error desant", true); console.error(error); } else toast();
      });
      tdC.appendChild(inpC); tr.appendChild(tdC);

      ["previst","real"].forEach(f=>{
        const td = document.createElement("td"); td.className = "num";
        const inp = document.createElement("input");
        inp.className = "cell-input"; inp.type = "number"; inp.step = "0.01"; inp.value = row[f];
        inp.disabled = !editable;
        inp.addEventListener("input", ()=>{ row[f] = parseFloat(inp.value)||0; updateTotals(kind); });
        inp.addEventListener("change", async ()=>{
          const { error } = await sb.from("finances").update({[f]:row[f]}).eq("id", row.id);
          if(error){ toast("Error desant", true); console.error(error); } else toast();
        });
        td.appendChild(inp); tr.appendChild(td);
      });

      if(hasJust){
        const td = document.createElement("td");
        const inp = document.createElement("input");
        inp.className = "cell-input text"; inp.value = row.justificant || "";
        inp.disabled = !editable;
        inp.addEventListener("change", async ()=>{
          row.justificant = inp.value;
          const { error } = await sb.from("finances").update({justificant:row.justificant}).eq("id", row.id);
          if(error){ toast("Error desant", true); console.error(error); } else toast();
        });
        td.appendChild(inp); tr.appendChild(td);
      }

      if(editable){
        const tdX = document.createElement("td");
        const btn = document.createElement("button");
        btn.className = "icon-btn"; btn.textContent = "✕"; btn.title = "Eliminar fila";
        btn.addEventListener("click", async ()=>{
          if(!confirm("Segur que vols eliminar aquesta fila?")) return;
          const { error } = await sb.from("finances").delete().eq("id", row.id);
          if(error){ toast("Error eliminant", true); console.error(error); return; }
          DATA[currentYear][kind] = rows.filter(r=>r.id!==row.id);
          toast("Eliminat"); renderMain();
        });
        tdX.appendChild(btn); tr.appendChild(tdX);
      }
      tbody.appendChild(tr);
    });

    const trT = document.createElement("tr");
    trT.className = "total-row";
    trT.innerHTML = '<td>Total</td>'+
      '<td class="num" data-total="previst">'+fmt(sum(rows,"previst"))+'</td>'+
      '<td class="num" data-total="real">'+fmt(sum(rows,"real"))+'</td>'+
      (hasJust ? '<td></td>' : '')+(editable ? '<td></td>' : '');
    tbody.appendChild(trT);
    table.appendChild(tbody);
    panel.appendChild(table);

    if(editable){
      const add = document.createElement("button");
      add.className = "add-row-btn"; add.textContent = "+ Afegir concepte";
      add.addEventListener("click", async ()=>{
        const payload = {year:currentYear, kind, concepte:"Nou concepte", previst:0, real:0};
        if(hasJust) payload.justificant = "-";
        const { data, error } = await sb.from("finances").insert(payload).select().single();
        if(error){ toast("Error afegint", true); console.error(error); return; }
        const nr = { id:data.id, concepte:data.concepte, previst:data.previst, real:data.real };
        if(hasJust) nr.justificant = data.justificant;
        yearData[kind].push(nr);
        toast(); renderMain();
      });
      panel.appendChild(add);
    }

    const bal = document.createElement("div");
    bal.className = "balance-row";
    bal.innerHTML = balanceHTML();
    panel.appendChild(bal);
    return panel;
  }

  function balanceHTML(){
    if(currentYear == null || !DATA[currentYear]) return "";
    const d = DATA[currentYear];
    const bp = sum(d.ingressos,"previst") - sum(d.despeses,"previst");
    const br = sum(d.ingressos,"real") - sum(d.despeses,"real");
    return '<div class="balance-box '+(bp>=0?'pos':'neg')+'"><div class="label">Balanç previst</div><div class="value">'+fmt(bp)+'</div></div>'+
      '<div class="balance-box '+(br>=0?'pos':'neg')+'"><div class="label">Balanç real</div><div class="value">'+fmt(br)+'</div></div>';
  }

  function updateTotals(kind){
    const rows = DATA[currentYear][kind];
    const tp = document.querySelector('[data-total="previst"]');
    const tr = document.querySelector('[data-total="real"]');
    if(tp) tp.textContent = fmt(sum(rows,"previst"));
    if(tr) tr.textContent = fmt(sum(rows,"real"));
    const bal = document.querySelector(".balance-row");
    if(bal) bal.innerHTML = balanceHTML();
  }

  // ---------- QUOTES PANEL ----------

    const editable = isAdmin();
    const wrap = document.createElement("div");

    const llistaTac = FESTIVALS.filter(f => f.year === currentYear && f.tipus === 'tac').sort((a,b)=>a.ordre - b.ordre);
    const llistaAmics = FESTIVALS.filter(f => f.year === currentYear && f.tipus === 'amics').sort((a,b)=>a.ordre - b.ordre);

    const p1 = document.createElement("div");
    p1.className = "panel";
    p1.innerHTML = '<h3>Quotes de festivals TAC ('+fmt(QUOTA_TAC)+' / festival)</h3>';
    p1.appendChild(buildQuotaGrid(llistaTac, "tac"));
    if(editable){
      const add1 = document.createElement("button");
      add1.className = "add-row-btn";
      add1.textContent = "+ Afegir festival TAC";
      add1.addEventListener("click", ()=> afegirFestivalRapid("tac"));
      p1.appendChild(add1);
    }
    wrap.appendChild(p1);

    const p2 = document.createElement("div");
    p2.className = "panel";
    p2.innerHTML = '<h3>Quotes Amics del TAC ('+fmt(QUOTA_AMICS)+' / amic)</h3>';
    p2.appendChild(buildQuotaGrid(llistaAmics, "amics"));
    if(editable){
      const add2 = document.createElement("button");
      add2.className = "add-row-btn";
      add2.textContent = "+ Afegir amic";
      add2.addEventListener("click", ()=> afegirFestivalRapid("amics"));
      p2.appendChild(add2);
    }
    wrap.appendChild(p2);

    const tacPaid = llistaTac.filter(q=>q.quota_pagada).length;
    const amPaid = llistaAmics.filter(q=>q.quota_pagada).length;
    const cobrat = tacPaid*QUOTA_TAC + amPaid*QUOTA_AMICS;
    const falta = (llistaTac.length-tacPaid)*QUOTA_TAC + (llistaAmics.length-amPaid)*QUOTA_AMICS;

    const p3 = document.createElement("div");
    p3.className = "panel";
    p3.innerHTML = '<h3>Resum de cobrament</h3>'+
      '<div class="quota-summary">'+
        '<div class="balance-box pos"><div class="label">Cobrat</div><div class="value">'+fmt(cobrat)+'</div></div>'+
        '<div class="balance-box neg"><div class="label">Falta cobrar</div><div class="value">'+fmt(falta)+'</div></div>'+
      '</div>';
    wrap.appendChild(p3);
    return wrap;
  }

  async function afegirFestivalRapid(tipus){
    if(!isAdmin()){ toast("No tens permisos", true); return; }
    const nom = prompt("Nom del festival a afegir:");
    if(!nom || !nom.trim()) return;
    
    const existents = FESTIVALS.filter(f => f.year === currentYear && f.tipus === tipus);
    const maxOrdre = existents.length > 0 ? Math.max(...existents.map(f=>f.ordre)) : -1;

    const { data, error } = await sb.from("festivals").insert({
      year: currentYear, 
      nom: nom.trim(), 
      tipus: tipus,
      ordre: maxOrdre + 1,
      quota_import: tipus === 'tac' ? QUOTA_TAC : QUOTA_AMICS,
      quota_pagada: false,
      estat: 'pendent'
    }).select().single();
    
    if(error){ toast("Error afegint: " + error.message, true); console.error(error); return; }
    FESTIVALS.push(data);
    toast("Afegit"); renderMain();
  }

  function buildQuotaGrid(list, tipus){
    const grid = document.createElement("div");
    grid.className = "quota-grid";
    const editable = isAdmin();
    
    if(list.length === 0){
      grid.innerHTML = '<div style="font-size:13.5px;color:var(--text-muted);padding:10px 0;">No hi ha festivals.</div>';
      return grid;
    }

    list.forEach(item=>{
      const div = document.createElement("div");
      div.className = "quota-item" + (item.quota_pagada ? " paid":"");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = item.quota_pagada;
      cb.disabled = !editable;
      cb.addEventListener("change", async ()=>{
        item.quota_pagada = cb.checked;
        const { error } = await sb.from("festivals").update({quota_pagada:item.quota_pagada}).eq("id", item.id);
        if(error){ toast("Error desant", true); console.error(error); cb.checked = !item.quota_pagada; item.quota_pagada = !item.quota_pagada; return; }
        toast(); renderMain();
      });
      const span = document.createElement("span");
      span.className = "quota-name";
      span.textContent = item.nom + (item.quota_pagada ? " ✓" : "");
      span.title = item.nom;
      div.appendChild(cb); div.appendChild(span);
      grid.appendChild(div);
    });
    return grid;
  }

  // ---------- GESTIÓ D'ANYS ----------
  async function afegirAny(){
    if(!isAdmin()){ toast("No tens permisos", true); return; }
    const input = prompt("Quin any vols afegir? (ex: 2027)");
    if(input === null) return;
    const any = parseInt(input, 10);
    if(!any || any < 2000 || any > 2100){ toast("Any no vàlid", true); return; }
    if(YEARS.includes(any)){ toast("Aquest any ja existeix", true); return; }

    YEARS.push(any);
    YEARS.sort((a,b)=> b - a);
    currentYear = any;
    if(!DATA) DATA = {};
    if(!DATA[any]) DATA[any] = {ingressos:[], despeses:[]};
    toast("Any " + any + " afegit");
    renderAll();
  }

  async function esborrarAny(){
    if(!isAdmin()){ toast("No tens permisos", true); return; }
    const any = currentYear;
    if(any == null){ toast("No hi ha cap any seleccionat", true); return; }
    if(!confirm("ATENCIÓ: Esborraràs TOTES les dades de l'any " + any + " (finances, quotes i festivals).\n\nSegur que vols continuar?")) return;
    if(!confirm("Confirma-ho una altra vegada: esborrar l'any " + any + " és irreversible.")) return;

    toast("Esborrant l'any " + any + "…");
    try{
      const { error: e1 } = await sb.from("finances").delete().eq("year", any);
      if(e1) throw e1;
      const { error: e2 } = await sb.from("festivals").delete().eq("year", any);
      if(e2) throw e2;

      YEARS = YEARS.filter(y => y !== any);
      if(DATA && DATA[any]) delete DATA[any];
      FESTIVALS = FESTIVALS.filter(f => Number(f.year) !== any);

      if(YEARS.length === 0){
        currentYear = null;
        toast("Any esborrat. No queden anys.", true);
      } else {
        currentYear = YEARS[0];
        toast("Any " + any + " esborrat");
      }
      renderAll();
    }catch(err){
      console.error(err);
      toast("Error esborrant: " + (err.message||err), true);
    }
  }

        tr.appendChild(tdAct);

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);

    wrap.appendChild(panel);
    return wrap;
  }

  async function moureFestival(f, direccio){
    if(!isAdmin()) return;
    const mateixTipus = FESTIVALS
      .filter(x => x.year === f.year && x.tipus === f.tipus)
      .sort((a,b) => a.ordre - b.ordre);
      
    const index = mateixTipus.findIndex(x => x.id === f.id);
    if(index === -1) return;
    
    const nouIndex = index + direccio;
    if(nouIndex < 0 || nouIndex >= mateixTipus.length) return;

    // Swap ordre
    const temp = mateixTipus[index].ordre;
    mateixTipus[index].ordre = mateixTipus[nouIndex].ordre;
    mateixTipus[nouIndex].ordre = temp;

    // Update DB
    const { error: e1 } = await sb.from("festivals").update({ordre: mateixTipus[index].ordre}).eq("id", mateixTipus[index].id);
    const { error: e2 } = await sb.from("festivals").update({ordre: mateixTipus[nouIndex].ordre}).eq("id", mateixTipus[nouIndex].id);
    
    if(e1 || e2) { toast("Error movent", true); console.error(e1, e2); return; }
    renderMain();
  }

  function buildFestivalForm(){
    const panel = document.createElement("div");
    panel.className = "panel";
    const isEdit = editingFestivalId != null;
    const f = isEdit ? (FESTIVALS.find(x=>x.id===editingFestivalId) || {}) : {};

    panel.innerHTML = '<h3>'+(isEdit?'Editar festival':'Afegir festival')+'</h3>';

    const form = document.createElement("form");
    form.className = "festival-form";

    function field(label, name, type, value, full){
      const d = document.createElement("div");
      d.className = "field" + (full ? " full" : "");
      const l = document.createElement("label");
      l.textContent = label; l.htmlFor = "f_"+name;
      const i = document.createElement("input");
      i.id = "f_"+name; i.name = name; i.type = type || "text";
      if(value != null) i.value = value;
      d.appendChild(l); d.appendChild(i);
      form.appendChild(d);
      return i;
    }

    // Tipus
    const dTipus = document.createElement("div");
    dTipus.className = "field";
    dTipus.innerHTML = '<label for="f_tipus">Tipus *</label>';
    const selTipus = document.createElement("select");
    selTipus.id = "f_tipus";
    ["tac", "amics"].forEach(t=>{
      const o = document.createElement("option");
      o.value = t; o.textContent = t === "tac" ? "Festival TAC" : "Amic del TAC";
      o.selected = (f.tipus || "tac") === t;
      selTipus.appendChild(o);
    });
    dTipus.appendChild(selTipus); form.appendChild(dTipus);

    const nom = field("Nom *","nom","text", f.nom || "");
    const ciutat = field("Ciutat","ciutat","text", f.ciutat || "");
    const pais = field("País","pais","text", f.pais || "Espanya");
    const web = field("Web","web","url", f.web || "");
    const cNom = field("Contacte (nom)","contacte_nom","text", f.contacte_nom || "");
    const cEmail = field("Contacte (email)","contacte_email","email", f.contacte_email || "");
    const dIni = field("Data inici","data_inici","date", f.data_inici || "");
    const dFi = field("Data fi","data_fi","date", f.data_fi || "");
    const imp = field("Import quota (€)","quota_import","number", f.quota_import != null ? f.quota_import : 60);
    imp.step = "0.01";

    // Estat
    const dEstat = document.createElement("div");
    dEstat.className = "field";
    dEstat.innerHTML = '<label for="f_estat">Estat</label>';
    const selEstat = document.createElement("select");
    selEstat.id = "f_estat";
    ESTATS.forEach(e=>{
      const o = document.createElement("option");
      o.value = e; o.textContent = e;
      o.selected = (f.estat || "pendent") === e;
      selEstat.appendChild(o);
    });
    dEstat.appendChild(selEstat); form.appendChild(dEstat);

    // Pagada
    const dPag = document.createElement("div");
    dPag.className = "field";
    const lblPag = document.createElement("label");
    lblPag.textContent = "Quota pagada";
    const chkPag = document.createElement("input");
    chkPag.type = "checkbox"; chkPag.checked = !!f.quota_pagada;
    chkPag.style.width = "auto";
    dPag.appendChild(lblPag); dPag.appendChild(chkPag);
    form.appendChild(dPag);

    // Data pagament
    const dPagData = field("Data pagament","quota_data_pagament","date", f.quota_data_pagament || "");

    // Notes
    const dNotes = document.createElement("div");
    dNotes.className = "field full";
    dNotes.innerHTML = '<label for="f_notes">Notes</label>';
    const taNotes = document.createElement("textarea");
    taNotes.id = "f_notes"; taNotes.value = f.notes || "";
    dNotes.appendChild(taNotes); form.appendChild(dNotes);

    // Accions
    const actions = document.createElement("div");
    actions.className = "festival-form-actions full";

    if(isEdit){
      const btnCancel = document.createElement("button");
      btnCancel.type = "button"; btnCancel.className = "btn-secondary"; btnCancel.textContent = "Cancel·lar";
      btnCancel.addEventListener("click", ()=>{ editingFestivalId = null; renderMain(); });
      actions.appendChild(btnCancel);
    }

    const btnSave = document.createElement("button");
    btnSave.type = "submit"; btnSave.className = "btn-primary";
    btnSave.textContent = isEdit ? "Desar canvis" : "Afegir festival";
    actions.appendChild(btnSave);
    form.appendChild(actions);

    form.addEventListener("submit", async (ev)=>{
      ev.preventDefault();
      if(!nom.value.trim()){ toast("El nom és obligatori", true); return; }

      let ordreFinal = f.ordre;
      if(!isEdit || (isEdit && f.tipus !== selTipus.value)){
        // Si és nou o ha canviat de tipus, l'afegim a l'última posició del seu tipus
        const existents = FESTIVALS.filter(x => x.year === currentYear && x.tipus === selTipus.value && x.id !== f.id);
        ordreFinal = existents.length > 0 ? Math.max(...existents.map(x=>x.ordre)) + 1 : 0;
      }

      const payload = {
        year: currentYear,
        nom: nom.value.trim(),
        tipus: selTipus.value,
        ordre: ordreFinal,
        ciutat: ciutat.value.trim() || null,
        pais: pais.value.trim() || null,
        web: web.value.trim() || null,
        contacte_nom: cNom.value.trim() || null,
        contacte_email: cEmail.value.trim() || null,
        data_inici: dIni.value || null,
        data_fi: dFi.value || null,
        quota_import: parseFloat(imp.value) || 0,
        quota_pagada: chkPag.checked,
        quota_data_pagament: dPagData.value || null,
        estat: selEstat.value,
        notes: taNotes.value.trim() || null,
        updated_at: new Date().toISOString()
      };

      btnSave.disabled = true; btnSave.textContent = "Desant…";

      if(isEdit){
        const { error } = await sb.from("festivals").update(payload).eq("id", editingFestivalId);
        btnSave.disabled = false; btnSave.textContent = "Desar canvis";
        if(error){ toast("Error desant: " + error.message, true); console.error(error); return; }
        toast("Festival actualitzat");
        editingFestivalId = null;
      } else {
        const { error } = await sb.from("festivals").insert(payload);
        btnSave.disabled = false; btnSave.textContent = "Afegir festival";
        if(error){ toast("Error afegint: " + error.message, true); console.error(error); return; }
        toast("Festival afegit");
      }

      await fetchFestivals();
      renderMain();
    });

    panel.appendChild(form);
    return panel;
  }

  async function removeFestival(f){
    if(!isAdmin()){ toast("No tens permisos", true); return; }
    if(!confirm('Segur que vols eliminar "' + (f.nom||"aquest festival") + '"?')) return;
    const { error } = await sb.from("festivals").delete().eq("id", f.id);
    if(error){ toast("Error eliminant: " + error.message, true); console.error(error); return; }
    FESTIVALS = FESTIVALS.filter(x=>x.id !== f.id);
    if(editingFestivalId === f.id) editingFestivalId = null;
    toast("Eliminat"); renderMain();
  }

  // ---------- BOOT ----------
  (async function(){
    showLoading();
    const { data:{ session } } = await sb.auth.getSession();
    if(session && session.user){
      currentUser = session.user;
      await bootApp();
    }else{
      showLogin();
    }
  })();

})();
</script>
</body>
